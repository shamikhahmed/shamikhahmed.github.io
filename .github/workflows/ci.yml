name: Hub CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Internal refs only — site is JS-driven, custom checker beats crawlers here
      - run: node scripts/check-links.mjs
