<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>IdeaCap has been retired — Capricorn Systems</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f5f7; --fg:#1d1d1f; --mute:rgba(29,29,31,.64); --tint:#9a6a2f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f5f5f7; --mute:rgba(245,245,247,.64); --tint:#e0a75e; } }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; text-align:center; padding:24px; }
  h1 { font-size:2rem; letter-spacing:-.02em; margin:0 0 12px; }
  p { color:var(--mute); max-width:34ch; margin:0 auto 24px; }
  a { display:inline-flex; min-height:44px; align-items:center; padding:0 22px; border-radius:999px; background:var(--tint); color:#fff; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>IdeaCap has been retired</h1>
  <p>Thanks for trying it. IdeaCap is no longer maintained. Explore the other Cap apps from Capricorn Systems.</p>
  <a href="/">See all apps</a>
</main>
<script>
  // Remove any installed service worker + caches left by the old app.
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (r.scope.indexOf('/IdeaCap/') !== -1) r.unregister(); }); });
  if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
</script>
</body>
</html>
