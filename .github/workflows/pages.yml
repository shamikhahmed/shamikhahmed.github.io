name: Deploy Pages

# Hub publishes repo root via Actions so internals (.cursor, .github, node_modules)
# are never served (C-53 / C-57). Replaces legacy branch-root Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site excluding internals
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '.cursor' \
            --exclude '.venv' \
            --exclude 'node_modules' \
            --exclude 'test-results' \
            --exclude 'playwright-report' \
            --exclude 'tests' \
            --exclude 'qa' \
            --exclude '_site' \
            --exclude 'scripts' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
