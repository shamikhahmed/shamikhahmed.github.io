<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CarCap">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="CarCap — vehicle garage, service log, fuel & docs. Offline-first by Capricorn Systems.">
  <meta name="author" content="Capricorn Systems">
  <title>CarCap — Capricorn Systems</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div class="offline-banner" role="status">Offline — data stays on this device</div>
    <header class="app-header">
      <div class="brand">
        <img class="brand-mark" src="icons/mark.svg" alt="" width="32" height="32">
        <div class="brand-text">
          <span class="brand-name">CarCap</span>
          <span class="brand-sub" id="header-sub">Your garage</span>
        </div>
      </div>
      <span class="pill muted" id="header-pill" hidden>Demo</span>
    </header>
    <main id="content" role="main"></main>
    <nav class="tab-bar" role="tablist" aria-label="Main">
      <button type="button" class="tab-btn active" data-tab="today" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg>
        Today
      </button>
      <button type="button" class="tab-btn" data-tab="garage" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-7 9 7"/><path d="M5 9.5V20h14V9.5"/><path d="M9 20v-6h6v6"/></svg>
        Garage
      </button>
      <button type="button" class="tab-btn" data-tab="service" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
        Service
      </button>
      <button type="button" class="tab-btn" data-tab="fuel" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M16 7h2.5A2.5 2.5 0 0 1 21 9.5V14a2 2 0 0 1-2 2h-1"/><path d="M9 7h3"/></svg>
        Fuel
      </button>
      <button type="button" class="tab-btn" data-tab="docs" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
        Docs
      </button>
      <button type="button" class="tab-btn" data-tab="settings" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
