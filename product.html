<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Redirecting… — Capricorn Systems</title>
  <script src="js/products-data.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      let slug = (params.get('p') || params.get('a') || 'vaultcap').toLowerCase();
      if (typeof LEGACY_SLUG_MAP !== 'undefined' && LEGACY_SLUG_MAP[slug]) {
        slug = LEGACY_SLUG_MAP[slug];
      }
      location.replace(slug + '.html');
    })();
  </script>
</head>
<body>
  <p style="font-family:system-ui;padding:40px;text-align:center">Redirecting to product page… <a id="fallback" href="vaultcap.html">VaultCap</a></p>
  <script>
    const slug = (new URLSearchParams(location.search).get('p') || 'vaultcap').toLowerCase();
    document.getElementById('fallback').href = slug + '.html';
  </script>
</body>
</html>
