<header class="top">

<main id="main">
  <section class="hero" aria-labelledby="h1">
    <div class="hero__text">
      <p class="eyebrow">Setup</p>
      <h1 id="h1">AuraCap</h1>
      <p class="hero__lead">Device setup, wallpaper and routine — private on your phone.</p>
      <div class="hero__cta"><a class="btn btn--fill" href="https://shamikhahmed.github.io/AuraCap/">Open AuraCap</a></div>
    </div>
    <div class="hero__visual" data-shot-theme="light" aria-hidden="true"><figure class="dev dev--mac hero__mac eager"><span class="dev__bar" aria-hidden="true"><i></i><i></i><i></i></span><img src="shots/light/mac/design-lock-screen-demo.webp" alt="Lock Screen screen" width="1200" height="750" decoding="async" fetchpriority="high"></figure><figure class="dev dev--iphone hero__phone eager"><img src="shots/light/iphone/design-lock-screen-demo.webp" alt="Lock Screen screen" width="600" height="1298" decoding="async" fetchpriority="high"></figure></div>
    <div class="hero__visual" data-shot-theme="dark" aria-hidden="true"><figure class="dev dev--mac hero__mac eager"><span class="dev__bar" aria-hidden="true"><i></i><i></i><i></i></span><img src="shots/dark/mac/design-lock-screen-demo.webp" alt="Lock Screen screen" width="1200" height="750" decoding="async" fetchpriority="high"></figure><figure class="dev dev--iphone hero__phone eager"><img src="shots/dark/iphone/design-lock-screen-demo.webp" alt="Lock Screen screen" width="600" height="1298" decoding="async" fetchpriority="high"></figure></div>
  </section>
  <section class="section" id="screens" aria-labelledby="screens-h">
    <div class="section__head">
      <div><h2 id="screens-h">Every screen</h2><p>15 screens from AuraCap, captured on iPhone, iPad and Mac.</p></div>
      <div class="gallery__tools">
        <div class="seg" role="group" aria-label="Device" data-gal="device"><button type="button" data-v="iphone" aria-pressed="true">iPhone</button><button type="button" data-v="ipad" aria-pressed="false">iPad</button><button type="button" data-v="mac" aria-pressed="false">Mac</button></div>
        <div class="seg" role="group" aria-label="Screenshot colours" data-gal="theme"><button type="button" data-v="light" aria-pressed="true">Light</button><button type="button" data-v="dark" aria-pressed="false">Dark</button></div>
      </div>
    </div>
    <div class="groups" role="tablist" aria-label="Screen groups" id="galGroups"></div>
    <div class="rail-wrap">
      <button type="button" class="rail__btn rail__btn--prev" aria-label="Previous screens" data-rail="-1">‹</button>
      <ol class="rail" id="galRail" aria-label="AuraCap screens"></ol>
      <button type="button" class="rail__btn rail__btn--next" aria-label="Next screens" data-rail="1">›</button>
    </div>
  </section>
</main>

</dialog>
