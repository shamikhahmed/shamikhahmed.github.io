<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Screen Gallery</title>
  <link rel="stylesheet" href="screen-gallery.css" />
</head>
<body>
  <a class="skip-link" href="#gallery-main">Skip to gallery</a>

  <header class="sg-header" role="banner">
    <div class="sg-header-top">
      <div class="sg-brand">
        <h1 class="sg-title" id="sg-title">Screen Gallery</h1>
        <p class="sg-meta" id="sg-meta" aria-live="polite">Loading manifest…</p>
      </div>
      <div class="sg-theme-toggle" role="group" aria-label="Viewer appearance">
        <button type="button" class="sg-chip" data-chrome="system" aria-pressed="true">System</button>
        <button type="button" class="sg-chip" data-chrome="light" aria-pressed="false">Light</button>
        <button type="button" class="sg-chip" data-chrome="dark" aria-pressed="false">Dark</button>
      </div>
    </div>

    <div class="sg-toolbar" role="toolbar" aria-label="Gallery filters">
      <div class="sg-filter-group" role="group" aria-label="Colour mode">
        <span class="sg-filter-label" id="lbl-theme">Theme</span>
        <button type="button" class="sg-chip" data-theme="light" aria-pressed="false" aria-describedby="lbl-theme">Light</button>
        <button type="button" class="sg-chip" data-theme="dark" aria-pressed="false" aria-describedby="lbl-theme">Dark</button>
        <button type="button" class="sg-chip" data-theme="both" aria-pressed="true" aria-describedby="lbl-theme">Both</button>
      </div>

      <div class="sg-filter-group" role="group" aria-label="Device">
        <span class="sg-filter-label" id="lbl-device">Device</span>
        <button type="button" class="sg-chip" data-device="iphone" aria-pressed="false" aria-describedby="lbl-device">iPhone</button>
        <button type="button" class="sg-chip" data-device="ipad" aria-pressed="false" aria-describedby="lbl-device">iPad</button>
        <button type="button" class="sg-chip" data-device="mac" aria-pressed="false" aria-describedby="lbl-device">Mac</button>
        <button type="button" class="sg-chip" data-device="all" aria-pressed="true" aria-describedby="lbl-device">All</button>
      </div>

      <div class="sg-filter-group sg-state-group">
        <label class="sg-filter-label" for="sg-state">State</label>
        <select id="sg-state" class="sg-select" aria-label="Filter by state">
          <option value="all">All states</option>
        </select>
      </div>

      <div class="sg-search-wrap">
        <label class="visually-hidden" for="sg-search">Search screens</label>
        <input id="sg-search" class="sg-search" type="search" placeholder="Search screens…" autocomplete="off" enterkeyhint="search" />
      </div>
    </div>
  </header>

  <main id="gallery-main" class="sg-main" tabindex="-1">
    <div id="sg-rails" class="sg-rails"></div>
    <p id="sg-empty" class="sg-empty" hidden>
      No screenshots match these filters. Run <code>npm run gallery</code> with
      <code>CAPTURE_GALLERY=1</code>, or adjust theme / device / state / search.
    </p>
  </main>

  <dialog id="sg-lightbox" class="sg-lightbox" aria-labelledby="sg-lb-caption">
    <div class="sg-lb-chrome">
      <button type="button" class="sg-lb-btn" id="sg-lb-prev" aria-label="Previous shot">‹</button>
      <button type="button" class="sg-lb-btn" id="sg-lb-next" aria-label="Next shot">›</button>
      <button type="button" class="sg-lb-btn sg-lb-close" id="sg-lb-close" aria-label="Close lightbox">✕</button>
    </div>
    <div class="sg-lb-stage" id="sg-lb-stage">
      <img id="sg-lb-img" alt="" draggable="false" />
    </div>
    <div class="sg-lb-meta">
      <p id="sg-lb-caption" class="sg-lb-caption"></p>
      <p id="sg-lb-detail" class="sg-lb-detail"></p>
    </div>
  </dialog>

  <script src="screen-gallery.js" defer></script>
</body>
</html>
