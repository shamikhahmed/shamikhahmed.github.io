<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PrismCap — Offline arcade games that stay on your device.</title>
<meta name="description" content="Offline arcade games that stay on your device.">
<link rel="canonical" href="https://shamikhahmed.github.io/apps/prismcap/">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/apps/assets/minisite.css">
<script>try{var t=localStorage.getItem('cap-ms-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-app="prismcap" data-repo="PrismCap">
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="/" aria-label="Capricorn OS home"><img src="/assets/logo.svg" alt="" width="22" height="22"><span>Capricorn</span></a>
  <nav class="top__nav" aria-label="Sections"><a href="#screens">Screens</a></nav>
  <a class="btn btn--fill btn--sm top__cta" href="https://shamikhahmed.github.io/PrismCap/">Open</a>
</header>
<main id="main">
  <section class="hero" aria-labelledby="h1">
    <div class="hero__text">
      <p class="eyebrow">Play</p>
      <h1 id="h1">PrismCap</h1>
      <p class="hero__lead">Offline arcade games that stay on your device.</p>
      <div class="hero__cta"><a class="btn btn--fill" href="https://shamikhahmed.github.io/PrismCap/">Open PrismCap</a></div>
    </div>
    <div class="hero__visual" data-shot-theme="light" aria-hidden="true"><figure class="dev dev--mac hero__mac eager"><span class="dev__bar" aria-hidden="true"><i></i><i></i><i></i></span><img src="shots/dark/mac/arcade-chess-demo.webp" alt="Chess screen" width="1200" height="750" decoding="async" fetchpriority="high"></figure><figure class="dev dev--iphone hero__phone eager"><img src="shots/dark/iphone/arcade-chess-demo.webp" alt="Chess screen" width="600" height="1298" decoding="async" fetchpriority="high"></figure></div>
    <div class="hero__visual" data-shot-theme="dark" aria-hidden="true"><figure class="dev dev--mac hero__mac eager"><span class="dev__bar" aria-hidden="true"><i></i><i></i><i></i></span><img src="shots/dark/mac/arcade-chess-demo.webp" alt="Chess screen" width="1200" height="750" decoding="async" fetchpriority="high"></figure><figure class="dev dev--iphone hero__phone eager"><img src="shots/dark/iphone/arcade-chess-demo.webp" alt="Chess screen" width="600" height="1298" decoding="async" fetchpriority="high"></figure></div>
  </section>
  <section class="section" id="screens" aria-labelledby="screens-h">
    <div class="section__head">
      <div><h2 id="screens-h">Every screen</h2><p>11 screens from PrismCap, captured on iPhone, iPad and Mac.</p></div>
      <div class="gallery__tools">
        <div class="seg" role="group" aria-label="Device" data-gal="device"><button type="button" data-v="iphone" aria-pressed="true">iPhone</button><button type="button" data-v="ipad" aria-pressed="false">iPad</button><button type="button" data-v="mac" aria-pressed="false">Mac</button></div>
        
      </div>
    </div>
    <div class="groups" role="tablist" aria-label="Screen groups" id="galGroups"></div>
    <div class="rail-wrap">
      <button type="button" class="rail__btn rail__btn--prev" aria-label="Previous screens" data-rail="-1">‹</button>
      <ol class="rail" id="galRail" aria-label="PrismCap screens"></ol>
      <button type="button" class="rail__btn rail__btn--next" aria-label="Next screens" data-rail="1">›</button>
    </div>
  </section>
</main>
<dialog class="lightbox" id="lightbox" aria-label="Screenshot">
  <button type="button" class="lightbox__close" data-lb="close" aria-label="Close">✕</button>
  <button type="button" class="lightbox__nav lightbox__nav--prev" data-lb="-1" aria-label="Previous">‹</button>
  <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
  <button type="button" class="lightbox__nav lightbox__nav--next" data-lb="1" aria-label="Next">›</button>
</dialog>
